; FGS (follower fingertip sensor) firmware: Seeed XIAO RP2040, earlephilhower arduino-pico core
;
;   pio run -e xiao_rp2040                 build
;   pio run -e xiao_rp2040 -t upload       flash (hold BOOT while plugging in for the first flash)
;   make -C test/native                    host-side unit tests (DSP vs float reference, params, ADC codec)
;
; Same toolchain notes as ../haptic_grip/platformio.ini (tool-scons shim if the registry is blocked).

[platformio]
default_envs = xiao_rp2040

[env:xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
board_build.f_cpu = 133000000L
build_flags =
    -O2
    -Wall
lib_extra_dirs = ../common
lib_deps =
    hgm_protocol
monitor_speed = 115200
