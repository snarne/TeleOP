; Haptic Grip Module firmware: Seeed XIAO RP2040, earlephilhower arduino-pico core
;
;   pio run -e xiao_rp2040                 build
;   pio run -e xiao_rp2040 -t upload       flash (hold BOOT while plugging in for the first flash)
;   make -C test/native                    host-side unit tests (protocol vectors + control law)

; Everything below resolves from GitHub (platform, core, toolchain, NeoPixel by git tag). Only
; tool-scons comes from the PlatformIO registry. If that is blocked, run `pip install scons` and
; create ~/.platformio/packages/tool-scons/{scons.py,package.json,.piopm}, where scons.py just
; calls SCons.Script.main() (see ../README.md).

[platformio]
default_envs = xiao_rp2040

[env:xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
board_build.f_cpu = 133000000L
build_flags =
    -O2
    -Wall
lib_extra_dirs = ../common
lib_deps =
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.12.3
    hgm_protocol
monitor_speed = 115200
