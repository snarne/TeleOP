[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop-station"
version = "0.1.0"
description = "Bimanual leader-follower teleoperation station for I2RT YAM arms with haptic grip triggers, synchronized multi-camera recording and LeRobot export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlmodel>=0.0.16",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "av>=12.0",
  "mcap>=1.1",
  "zstandard>=0.22",
  "pyserial>=3.5",
  "dynamixel-sdk>=3.7.31",
  "psutil>=5.9",
  "pyarrow>=14",
]

[project.optional-dependencies]
# Real follower arms: install I2RT's SDK from https://github.com/i2rt-robotics/i2rt (pip install -e path/to/i2rt)
lerobot = ["lerobot>=0.4"]
realsense = ["pyrealsense2>=2.54"]
input = ["evdev>=1.7; sys_platform == 'linux'"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
station = "station.cli:main"

[tool.setuptools.packages.find]
include = ["station*"]

[tool.setuptools.package-data]
station = ["calibration/templates/*.py.tmpl", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
